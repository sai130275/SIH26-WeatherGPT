version: '3.8'

services:
  node-orchestrator:
    build: .
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/weathergpt
      - REDIS_URL=redis://redis:6379
      - RISK_ENGINE_URL=http://python-risk-engine:8000
      - JWT_SECRET=supersecretweathergptjwtkey2026
    depends_on:
      - mongodb
      - redis
      - python-risk-engine

  python-risk-engine:
    build:
      context: ./risk-engine
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

volumes:
  mongo_data:
